; Faster Shadows 1.0 -- staggered sun-shadow cascades and a worker-thread caster cull, plus optional
; caster rules after dnai92's Shadow Performance Settings (SPS 1.0.52).
; Configuration is read at startup. Distances/radii are game units (~70 units = 1 m).
; With the Mod Configuration Menu installed, its Faster Shadows page saves choices to
; Data/MCM/Settings/FasterShadows.ini, and a saved choice wins over the same option here. Its switches
; apply at once; the shadow rules the next time the game starts.
[General]
Enabled=1
; 0 removes the shadows of casters the rules below select (small, far objects; far actors).
; 1 keeps every caster shadow; with Diagnostics=1 it counts filter candidates instead.
; CascadeCadence controls cascade reuse separately from this caster-filter setting.
DryRun=0
; Enable eligible-shadow counters and periodic reports for analysis only.
Diagnostics=0
; Windows virtual key: 121 = F10 (laptops lack Page Up; hold Fn where F keys need it). 0 disables the toggle.
ToggleKey=121
ReportSeconds=60

[SunShadows]
; Optional caster rule: small, far objects stop casting sun shadows. The radius counts as the
; shadow length radius/sin(sun elevation). Filters every cascade caster, including precombined
; and previs geometry. The nearest cascade (0) is never filtered. Off by default: with the
; staggered cascades below it saved about 0.1 ms per frame, too little to measure in frame rate.
Enabled=0
MinCascade=1
MinDistance=1500
MaxRadius=150
MinAngularSize=0.035
MinSunElevation=10
; Staggered cascade updates: the middle cascade updates every second frame and the far one
; every fourth; in between each keeps its previous shadow map and the projection that matches
; it. The nearest cascade (0) always updates. A cascade updates anyway after the camera moves
; or turns further than the limits below, or when the sun, cell or projection changes.
; Loading a game or reinitializing the renderer invalidates saved maps and cameras.
CascadeCadence=1
MidCascadeInterval=2
FarCascadeInterval=4
; How many cascades may keep their map in the same frame. At 2 (the default) the far cascade
; waits longer, never updating on the same frame as the middle one. At 1 the middle and far
; cascades strictly alternate (use FarCascadeInterval=2 with it).
CadenceMaxWaiting=2
CadenceMaxMove=64
CadenceMaxTurn=2
; How far (degrees) the sun may turn before a waiting cascade updates anyway. 0: any sun change,
; including the game's one-second slide between sun steps, updates all cascades. Experimental.
CadenceMaxSunTurn=0
; Which rules decide when a waiting cascade updates anyway. 0: the limits above. 1, for
; comparison only: the staggered rules of Fallout 4 Community Shaders (Bryant-21): fixed
; frames per interval, an update when the kept map no longer covers what the camera sees, and
; a full update after a camera jump or a sun turn over 0.25 degrees. CadenceMaxWaiting,
; CadenceMaxMove and CadenceMaxTurn do not apply there.
CadencePolicy=0
; A cascade that keeps its previous map does not need this frame's casters either: skip
; its caster cull (areas with precombined visibility) or its caster registration, so the
; reuse also saves CPU time. Fallout 4 1.10.163, 1.10.984 and 1.11.240.
CadenceSkipCull=1
; A cascade whose depth range is empty (3 splits with fDirShadowDistance at or below 3000, or
; 4 splits) is drawn once and then kept, instead of being culled and drawn every frame for
; nothing. The default presets never have one. Needs CascadeCadence=1. Experimental.
SkipEmptyCascades=0
; Keep a cascade's fitted shadow camera for up to this many frames (at most 60) while it still
; covers the view and the sun has not turned, so the shadow texels stand still between refits.
; 0: refit every frame. Needs CascadeCadence=1. Experimental.
HoldFitFrames=0
; While a cascade keeps its held camera (HoldFitFrames), draw its unmoving shadow casters once,
; copy them aside, and on later frames copy them back and draw only the moving casters (actors,
; skinned and moving objects) on top. It pays off while the view holds still, so use a long
; HoldFitFrames (e.g. 30). Middle and far cascades. Experimental.
StaticShadowCache=0
; Gather the sun's shadow casters on a separate thread while the main thread draws the
; scene, instead of on the main thread afterwards. Same casters, same shadows; outdoors with
; precombined visibility only. 1.10.163, 1.10.984 and 1.11.240.
CullOnWorkerThread=1

[PointShadows]
; Optional caster rule for point (omni) and spot lamps. Objects close to the lamp keep their
; shadow, and the possible shadow size on surfaces within the lamp's reach is what counts. Off by default.
Enabled=0
MinDistance=1000
MaxRadius=150
MinAngularSize=0.035
; Also filter spot-light shadow maps.
SpotLights=1
; Optional interior filtering, including actor shadows for both point and spot lamps.
; Off by default, as in SPS.
Interiors=0

[ActorShadows]
; Optional caster rule: characters and creatures beyond this distance cast no shadows (3500 ~ 50 m;
; values below 2100 ~ 30 m are raised). Not applied with a low sun. Decided per character
; by its position: a shadow switched off returns only within 90% of the distance, so
; characters near the limit do not flicker. Off by default.
Enabled=0
MinDistance=3500
; Also for lamp shadows.
PointLights=1

[RainOcclusion]
; Objects smaller than this radius are left out of the top-down rain occlusion map.
; Off by default: rain or snow can then fall through small roofs.
Enabled=0
MinRadius=128

[Optimizations]
; Independent experimental techniques for the point-light path. No shadow-map depth is cached.
; The volume test checks the whole infinite shadow cone, not caster visibility.
; Analysis only: volume candidates never remove a caster, even with DryRun=0.
ShadowVolume=0
SquaredDistance=1
LightSnapshot=1
BatchCounters=1
; Scoped to one synchronous light traversal; changed bounds/light always miss.
DecisionMemo=0
; The sun-glare visibility check reads its result without forcing the GPU command buffer
; out mid-frame; the glare then reacts up to one frame later. Experimental.
SunGlareNoFlush=0

[VR]
; Fallout 4 VR 1.2.72 only. VR staggers its own sun cascades and refits a far one only every few frames;
; with this on, a cascade the head moved or turned away from joins the game's next refit. It only adds
; to the game's schedule (and to Fallout 4 VR Shadow Boost's), never removes from it. The cascade
; features of [SunShadows] and the worker thread are desktop-only; the optional caster rules apply on VR too.
CascadeRedraw=1
; Game units the view may move, and degrees it may turn, before a cascade's fit counts as stale.
CascadeMaxMove=128
CascadeMaxTurn=10
CascadeMaxSunTurn=0.5
